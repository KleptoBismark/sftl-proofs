<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>SFTL — Owner Dashboard</title>
<link rel="icon" type="image/svg+xml" href="../../assets/brand/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../../assets/brand/favicon-16.png">
<link rel="apple-touch-icon" href="../../assets/brand/favicon-180.png">
<style>
  :root {
    --bg: #131313; --panel: #1c1c1c; --panel2: #242424; --line: #303030;
    --text: #ececec; --dim: #9a9a9a; --star: #f0b429; --fav: #e05a5f;
    --accent: #C13A2E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  a { color: inherit; }

  header {
    position: sticky; top: 0; z-index: 20; background: rgba(19,19,19,.92);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
    padding: 12px 18px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 9px; margin-bottom: 7px;
    font-size: 10.5px; letter-spacing: .24em; color: var(--dim);
    text-decoration: none;
  }
  .brand img { width: 20px; height: 20px; display: block; }
  .brand:hover { color: var(--text); }
  .hrow { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 17px; font-weight: 600; letter-spacing: .02em; }
  .rolebadge {
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    border: 1px solid var(--accent); color: var(--accent);
    border-radius: 99px; padding: 2px 9px;
  }

  main { padding: 16px; max-width: 1100px; margin: 0 auto; }
  .center { padding: 60px 20px; text-align: center; color: var(--dim); }

  .gcard {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 16px 18px; margin-bottom: 14px;
  }
  .gtop { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .gtitle { font-size: 16px; font-weight: 600; }
  .gsub { color: var(--dim); font-size: 13px; }
  .statrow { display: flex; gap: 22px; flex-wrap: wrap; margin: 12px 0 4px; }
  .stat { min-width: 64px; }
  .stat b { display: block; font-size: 19px; font-weight: 600; }
  .stat.hot b { color: var(--star); }
  .stat span { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); }
  .linkrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .chip {
    border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px;
    font-size: 13px; color: var(--dim); transition: .15s; text-decoration: none;
  }
  .chip:hover { color: var(--text); border-color: #4a4a4a; }
  .chip.go { border-color: var(--accent); color: var(--accent); }
  .chip.go:hover { background: var(--accent); color: #FCFCFA; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 16px; font-size: 13px; display: none; z-index: 60;
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="../../"><img src="../../assets/brand/sftl-mark-small.svg" alt="">STORIES FROM THE LENS</a>
  <div class="hrow">
    <h1>Owner Dashboard</h1>
    <span class="rolebadge">Owner</span>
  </div>
</header>
<main id="app"><div class="center">Loading galleries…</div></main>
<div class="toast" id="toast"></div>
<script>
(function () {
  var SUPA = "https://yignpdzywcxbfhdqipav.supabase.co";
  var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlpZ25wZHp5d2N4YmZoZHFpcGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxMjE5MDAsImV4cCI6MjA4NTY5NzkwMH0.RLzcnZNDQBis5z6WPLqTUSeaRJxjOh9p1kk89PDtsCQ";
  var token = new URLSearchParams(location.search).get("t") || "";
  var PORTAL = location.origin + location.pathname.replace(/admin\/?(index\.html)?$/, "");
  var app = document.getElementById("app");

  function rpc(name, args) {
    return fetch(SUPA + "/rest/v1/rpc/" + name, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": KEY, "Authorization": "Bearer " + KEY },
      body: JSON.stringify(args)
    }).then(function (r) {
      if (!r.ok) { return r.text().then(function (t) { throw new Error(t || r.status); }); }
      var ct = r.headers.get("content-type") || "";
      return ct.indexOf("json") >= 0 ? r.json() : null;
    });
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function toast(msg, ms) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.style.display = "block";
    clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = "none"; }, ms || 2200);
  }
  function copy(text, label) {
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
      .then(function () { toast(label + " copied"); })
      .catch(function () { window.prompt("Copy " + label + ":", text); });
  }
  function fmtDate(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) +
      " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }

  function render(galleries) {
    if (!galleries.length) {
      app.innerHTML = '<div class="center">No galleries yet.</div>';
      return;
    }
    app.innerHTML = galleries.map(function (g, idx) {
      return '<section class="gcard" data-i="' + idx + '">' +
        '<div class="gtop"><span class="gtitle">' + esc(g.title) + '</span>' +
        '<span class="gsub">' + esc(g.client_name || "client TBC") +
        ' · created ' + fmtDate(g.created_at) + '</span></div>' +
        '<div class="statrow">' +
        '<div class="stat"><b>' + g.image_count + '</b><span>Photos</span></div>' +
        '<div class="stat"><b>' + g.rated_count + '/' + g.image_count + '</b><span>Rated</span></div>' +
        '<div class="stat hot"><b>' + g.edit_count + '</b><span>To edit (★4+)</span></div>' +
        '<div class="stat"><b>' + (g.avg_rating == null ? "—" : g.avg_rating) + '</b><span>Avg ★</span></div>' +
        '<div class="stat"><b>' + g.comment_count + '</b><span>Comments</span></div>' +
        '<div class="stat"><b style="font-size:13px;line-height:1.6">' + fmtDate(g.last_activity) + '</b><span>Last activity</span></div>' +
        '</div>' +
        '<div class="linkrow">' +
        '<a class="chip go" href="' + PORTAL + '?t=' + esc(g.admin_token) + '" target="_blank" rel="noopener">Open as photographer</a>' +
        '<button class="chip" data-copy="client" data-i="' + idx + '">Copy client link</button>' +
        '<button class="chip" data-copy="admin" data-i="' + idx + '">Copy photographer link</button>' +
        '</div></section>';
    }).join("");
    app.addEventListener("click", function (e) {
      var b = e.target.closest("[data-copy]");
      if (!b) return;
      var g = galleries[+b.getAttribute("data-i")];
      if (b.getAttribute("data-copy") === "client") {
        copy(PORTAL + "?t=" + g.share_token, "Client link");
      } else {
        copy(PORTAL + "?t=" + g.admin_token, "Photographer link");
      }
    });
  }

  if (!token) {
    app.innerHTML = '<div class="center">Missing token. Open your owner link with <code>?t=…</code></div>';
    return;
  }
  rpc("proof_owner_overview", { p_token: token })
    .then(function (d) { render(d.galleries || []); })
    .catch(function (err) {
      app.innerHTML = '<div class="center">' +
        (String(err.message).indexOf("42501") >= 0 || String(err.message).indexOf("invalid token") >= 0
          ? "Invalid owner token."
          : "Could not load galleries. " + esc(err.message)) + '</div>';
    });
})();
</script>
</body>
</html>
