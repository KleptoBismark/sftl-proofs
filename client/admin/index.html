<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>SFTL — Owner Dashboard</title>
<link rel="icon" type="image/svg+xml" href="../../assets/brand/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../../assets/brand/favicon-16.png">
<link rel="apple-touch-icon" href="../../assets/brand/favicon-180.png">
<link rel="stylesheet" href="../../assets/owner-upload.css?v=20260923-1">
<style>
  :root {
    --bg: #131313; --panel: #1c1c1c; --panel2: #242424; --line: #303030;
    --text: #ececec; --dim: #9a9a9a; --star: #f0b429; --fav: #e05a5f;
    --accent: #C13A2E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  a { color: inherit; }

  header {
    position: sticky; top: 0; z-index: 20; background: rgba(19,19,19,.92);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
    padding: 12px 18px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 9px; margin-bottom: 7px;
    font-size: 10.5px; letter-spacing: .24em; color: var(--dim);
    text-decoration: none;
  }
  .brand img { width: 20px; height: 20px; display: block; }
  .brand:hover { color: var(--text); }
  .hrow { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 17px; font-weight: 600; letter-spacing: .02em; }
  .rolebadge {
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    border: 1px solid var(--accent); color: #ed8c81;
    border-radius: 99px; padding: 2px 9px;
  }

  main { padding: 16px; max-width: 1100px; margin: 0 auto; }
  .center { padding: 60px 20px; text-align: center; color: var(--dim); }

  .gcard {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 16px 18px; margin-bottom: 14px;
  }
  .gtop { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .gtitle { font-size: 16px; font-weight: 600; }
  .gsub { color: var(--dim); font-size: 13px; }
  .statrow { display: flex; gap: 22px; flex-wrap: wrap; margin: 12px 0 4px; }
  .stat { min-width: 64px; }
  .stat b { display: block; font-size: 19px; font-weight: 600; }
  .stat.hot b { color: var(--star); }
  .stat span { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); }
  .linkrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .chip {
    border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px;
    font-size: 13px; color: var(--dim); transition: .15s; text-decoration: none;
  }
  .chip:hover { color: var(--text); border-color: #4a4a4a; }
  .chip.go { border-color: #ed8c81; color: #ed8c81; }
  .chip.go:hover { background: var(--accent); color: #FCFCFA; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 16px; font-size: 13px; display: none; z-index: 60;
  }
  :focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  button:disabled { opacity:.55; cursor:wait; }
  .chip { min-height:44px; display:inline-flex; align-items:center; }
  .stageform { display:flex; flex-wrap:wrap; gap:12px; margin-top:18px; align-items:end; }
  .stageform label { display:grid; gap:5px; color:var(--dim); font-size:13px; }
  select { max-width:100%; background:var(--panel2); color:var(--text); border:1px solid #666; border-radius:5px; font:inherit; padding:10px; }
  .album-status { margin-top:12px; color:var(--text); }
  @media(max-width:480px) { header {position:static;} .stageform label {width:100%;} }
</style>
</head>
<body>
<header>
  <a class="brand" href="../../"><img src="../../assets/brand/sftl-mark-small.svg" alt="">STORIES FROM THE LENS</a>
  <div class="hrow">
    <h1>Owner Dashboard</h1>
    <span class="rolebadge">Owner</span><button class="chip" onclick="location.reload()">Refresh dashboard</button>
  </div>
</header>
<main id="app"><div class="center">Loading galleries…</div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="../../assets/js/ui.js?v=20260922-2"></script>
<script src="../../assets/js/owner-upload.js?v=20260923-1"></script>
<script>
(function () {
  var SUPA = "https://yignpdzywcxbfhdqipav.supabase.co";
  var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlpZ25wZHp5d2N4YmZoZHFpcGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxMjE5MDAsImV4cCI6MjA4NTY5NzkwMH0.RLzcnZNDQBis5z6WPLqTUSeaRJxjOh9p1kk89PDtsCQ";
  var token = new URLSearchParams(location.search).get("t") || "";
  var PORTAL = location.origin + location.pathname.replace(/admin\/?(index\.html)?$/, "");
  var app = document.getElementById("app");

  function rpc(name, args) {
    var controller = new AbortController();
    var timeout = setTimeout(function () { controller.abort(); }, 20000);
    return fetch(SUPA + "/rest/v1/rpc/" + name, {
      signal: controller.signal,
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": KEY, "Authorization": "Bearer " + KEY },
      body: JSON.stringify(args)
    }).then(function (r) {
      if (!r.ok) { return r.text().then(function (t) { var error = new Error(t || r.status); error.status = r.status; throw error; }); }
      var ct = r.headers.get("content-type") || "";
      return ct.indexOf("json") >= 0 ? r.json() : null;
    }).finally(function () { clearTimeout(timeout); });
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function toast(msg, ms) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.style.display = "block";
    clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = "none"; }, ms || 2200);
  }
  function copy(text, label) {
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
      .then(function () { toast(label + " copied"); })
      .catch(function () { window.prompt("Copy " + label + ":", text); });
  }
  function galleryCode(g) { return (g.access_code || '').match(/.{1,4}/g)?.join('-') || ''; }
  function fmtDate(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) +
      " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }

  var albums = [];
  var stages = {review:"Reviewing",submitted:"Selection submitted",editing:"Editing",delivered:"Delivered"};
  function render(galleries) {
    albums = galleries;
    if (!galleries.length) { app.innerHTML = '<div class="center">No albums yet.</div>'; return; }
    app.innerHTML = galleries.map(function (g, idx) {
      var stage = g.stage || "review";
      return '<section class="gcard" data-i="' + idx + '">' +
        '<div class="gtop"><h2 class="gtitle">' + esc(g.title) + '</h2><span class="gsub">' + esc(g.client_name || "Client name not set") + '</span></div>' +
        '<p class="album-status">' + esc(stages[stage]) + (g.album_mode === "delivery" ? ' · Delivery album' : ' · Selection and delivery') + '</p>' +
        '<div class="statrow">' +
        '<div class="stat"><b>' + g.rated_count + '/' + g.image_count + '</b><span>Rated</span></div>' +
        '<div class="stat hot"><b>' + g.edit_count + '</b><span>Selected ★4+</span></div>' +
        '<div class="stat"><b>' + (g.finals_count || 0) + '</b><span>Finished photos</span></div>' +
        '<div class="stat"><b>' + (g.remaining_count == null ? "—" : g.remaining_count) + '</b><span>Selected without finals</span></div>' +
        '<div class="stat"><b>' + g.comment_count + '</b><span>Comments</span></div></div>' +
        '<p class="gsub">Last activity: ' + fmtDate(g.last_activity) + (g.submitted_at ? ' · Submitted: ' + fmtDate(g.submitted_at) : '') + '</p>' +
        (g.access_code ? '<p class="gsub">Gallery code: <code>' + esc(galleryCode(g)) + '</code></p><div class="linkrow"><button class="chip" data-copy="invitation" data-i="' + idx + '">Copy client invitation</button><button class="chip" data-copy="code" data-i="' + idx + '">Copy gallery code</button></div>' : '') +
        '<div class="linkrow"><a class="chip go" href="' + PORTAL + '?t=' + esc(g.admin_token) + '" target="_blank" rel="noopener noreferrer">Open as photographer</a>' +
        '<button class="chip" data-copy="client" data-i="' + idx + '">Copy client album link</button>' +
        (g.finals_count ? '<button class="chip" data-copy="finals" data-i="' + idx + '">Copy finished-photo link</button><a class="chip" href="' + PORTAL + 'finals/?t=' + esc(g.admin_token) + '">View finished photos</a>' : '') +
        '<button class="chip" data-add-finals data-i="' + idx + '">Add finished photos</button>' +
        '<button class="chip" data-copy="admin" data-i="' + idx + '">Copy photographer link</button></div>' +
        (g.workflow_version == null ? '' : '<div class="stageform" data-i="' + idx + '"><label>Album stage<select name="stage">' + Object.keys(stages).map(function (v) {return '<option value="' + v + '"' + (v===stage?' selected':'') + '>' + stages[v] + '</option>';}).join('') +
        '</select></label><label>Client experience<select name="mode"><option value="proofing"' + (g.album_mode!=="delivery"?' selected':'') + '>Choose, then receive photos</option><option value="delivery"' + (g.album_mode==="delivery"?' selected':'') + '>Finished photos only</option></select></label><button class="chip" type="button" data-update>Update album</button></div>') +
        '<p class="gsub">The client album link stays the same at every stage. Updating this dashboard does not send a client message.</p>' +
        '<p class="update-message" role="status" aria-live="polite"></p></section>';
    }).join("");
  }
  app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-copy]");
    if (!b) return;
    var g = albums[+b.dataset.i], type = b.dataset.copy;
    if (type === "code") { copy(galleryCode(g), "Gallery code"); return; }
    if (type === "invitation") {
      copy('Your album: ' + g.title + '\n\n' + PORTAL + '?t=' + g.share_token + '\n\nYou can also visit ' + PORTAL + ' and enter your gallery code: ' + galleryCode(g), "Client invitation"); return;
    }
    copy(PORTAL + (type === "finals" ? 'finals/' : '') + '?t=' + (type === "admin" ? g.admin_token : g.share_token), type === "admin" ? "Photographer link" : type === "finals" ? "Finished-photo link" : "Client album link");
  });
  app.addEventListener("click", async function (e) {
    var trigger = e.target.closest("[data-update]");
    if (!trigger || trigger.disabled) return;
    var form = trigger.closest(".stageform"), g = albums[+form.dataset.i], button = form.querySelector('button'), message = form.parentElement.querySelector('.update-message');
    var stage = form.querySelector('[name="stage"]').value, mode = form.querySelector('[name="mode"]').value;
    if (stage === g.stage && mode === g.album_mode) { message.textContent = "No changes to save."; return; }
    if (!await SFTLDialog.confirm('Update “' + g.title + '” to ' + stages[stage] + (mode==='delivery' ? ', showing finished photos only' : ', with selection and delivery') + '? Existing client links will stay valid.')) return;
    button.disabled = true; message.textContent = "Updating album…";
    try {
      await rpc("proof_set_album_stage", {p_token:token,p_gallery_id:g.id,p_stage:stage,p_expected_version:g.workflow_version,p_mode:mode});
      await load(); toast("Album updated. Existing links remain valid.");
    } catch (error) {
      message.textContent = /40001/.test(error.message) ? "The album changed elsewhere. Refresh the dashboard before updating it." : /submit the selection/.test(error.message) ? "Submit the client's selection before starting editing." : /choose at least/.test(error.message) ? "Choose at least one photo with 4 or 5 stars before submitting." : /add finished/.test(error.message) ? "Add finished photos before marking this album delivered." : "The update could not be confirmed. Refresh to check its status before retrying.";
    } finally { button.disabled = false; }
  });
  async function load() {
    var d = await rpc("proof_owner_overview", {p_token:token});
    render(d.galleries || []);
  }

  if (!token) {
    app.innerHTML = '<div class="center">Missing token. Open your owner link with <code>?t=…</code></div>';
    return;
  }
  load().then(function () {
    SFTLOwnerUpload.install({host:app,token:token,key:KEY,supa:SUPA,rpc:rpc,refresh:load,getAlbums:function(){return albums;},escape:esc});
  })
    .catch(function (err) {
      app.innerHTML = '<div class="center">' +
        (String(err.message).indexOf("42501") >= 0 || String(err.message).indexOf("invalid token") >= 0
          ? "Invalid owner token."
          : "Could not load your albums. Check your connection and try again.") + '<p><button class="chip" onclick="location.reload()">Refresh dashboard</button></p></div>';
    });
})();
</script>
</body>
</html>
