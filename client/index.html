<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<title>Stories From The Lens — Proof Gallery</title>
<link rel="icon" type="image/svg+xml" href="../assets/brand/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/brand/favicon-16.png">
<link rel="apple-touch-icon" href="../assets/brand/favicon-180.png">
<style>
  :root {
    --bg: #131313; --panel: #1c1c1c; --panel2: #242424; --line: #303030;
    --text: #ececec; --dim: #9a9a9a; --star: #f0b429; --fav: #e05a5f;
    --accent: #C13A2E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  img { display: block; max-width: 100%; }

  header {
    position: sticky; top: 0; z-index: 20; background: rgba(19,19,19,.92);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
    padding: 12px 18px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 9px; margin-bottom: 7px;
    font-size: 10.5px; letter-spacing: .24em; color: var(--dim);
    text-decoration: none;
  }
  .brand img { width: 20px; height: 20px; display: block; }
  .brand:hover { color: var(--text); }
  .hrow { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 17px; font-weight: 600; letter-spacing: .02em; }
  .sub { color: var(--dim); font-size: 13px; }
  .rolebadge {
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    border: 1px solid var(--accent); color: var(--accent);
    border-radius: 99px; padding: 2px 9px;
  }
  .progresswrap { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
  .pbar { flex: 1; max-width: 260px; height: 4px; background: var(--panel2); border-radius: 99px; overflow: hidden; }
  .pbar i { display: block; height: 100%; background: var(--star); width: 0; transition: width .3s; }
  .pcount { font-size: 12px; color: var(--dim); white-space: nowrap; }

  .toolbar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .chip {
    border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px;
    font-size: 13px; color: var(--dim); transition: .15s;
  }
  .chip:hover { color: var(--text); border-color: #4a4a4a; }
  .chip.on { color: #111; background: var(--text); border-color: var(--text); font-weight: 600; }
  .chip.warn { border-color: var(--fav); color: var(--fav); }
  a.chip.finals { border-color: var(--accent); color: var(--accent); text-decoration: none; }
  a.chip.finals:hover { background: var(--accent); color: #FCFCFA; }
  .spacer { flex: 1; }
  .savestate { font-size: 12px; color: var(--dim); min-width: 60px; text-align: right; }
  .savestate.err { color: var(--fav); }

  main { padding: 16px; max-width: 1500px; margin: 0 auto; }
  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  }
  @media (max-width: 560px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; } }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    overflow: hidden; transition: border-color .15s, transform .1s; position: relative;
  }
  .card:hover { border-color: #4d4d4d; }
  .card .imgwrap { aspect-ratio: 4 / 3; background: #0c0c0c; cursor: pointer; position: relative; }
  .card .imgwrap img { width: 100%; height: 100%; object-fit: cover; }
  .card.selected { outline: 2px solid var(--accent); outline-offset: -2px; }
  .selbadge {
    position: absolute; top: 8px; left: 8px; width: 24px; height: 24px; border-radius: 50%;
    background: var(--accent); color: #FCFCFA; font-size: 13px; font-weight: 700;
    display: none; align-items: center; justify-content: center;
  }
  .card.selected .selbadge { display: flex; }
  .cardmeta { padding: 8px 10px 9px; }
  .fname { font-size: 11.5px; color: var(--dim); letter-spacing: .02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cardrow { display: flex; align-items: center; margin-top: 5px; gap: 8px; }
  .stars { display: inline-flex; gap: 1px; }
  .stars button { font-size: 17px; line-height: 1; color: #4d4d4d; padding: 2px 1px; transition: color .1s, transform .05s; }
  .stars button.lit { color: var(--star); }
  .stars button:active { transform: scale(1.25); }
  .cbadge { font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 99px; padding: 1px 7px; margin-left: auto; }
  .cbadge:empty { display: none; }

  /* Lightbox */
  .lb {
    position: fixed; inset: 0; z-index: 50; background: rgba(10,10,10,.97);
    display: none; flex-direction: column;
  }
  .lb.open { display: flex; }
  .lbtop { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
  .lbtop .fname { font-size: 13px; }
  .lbcount { font-size: 12px; color: var(--dim); }
  .lbclose { margin-left: auto; font-size: 22px; color: var(--dim); padding: 4px 10px; }
  .lbclose:hover { color: var(--text); }
  .lbbody { flex: 1; display: flex; min-height: 0; }
  .lbstage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; min-width: 0; padding: 0 8px; }
  .lbstage img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .navbtn {
    position: absolute; top: 50%; transform: translateY(-50%); font-size: 34px;
    color: rgba(255,255,255,.65); padding: 24px 14px; user-select: none; z-index: 2;
  }
  .navbtn:hover { color: #fff; }
  .navbtn.prev { left: 0; } .navbtn.next { right: 0; }
  .lbside {
    width: 320px; border-left: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; padding: 16px; gap: 14px; overflow-y: auto;
  }
  .lbside .stars button { font-size: 26px; padding: 2px 3px; }
  .sidelabel { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-bottom: 6px; }
  .comments { display: flex; flex-direction: column; gap: 10px; }
  .comment { background: var(--panel2); border-radius: 8px; padding: 8px 11px; font-size: 13.5px; }
  .comment .who { font-size: 11px; color: var(--dim); margin-bottom: 3px; display: flex; justify-content: space-between; gap: 8px; }
  .comment .who .del { color: #6e6e6e; font-size: 11px; }
  .comment .who .del:hover { color: var(--fav); }
  .cform { display: flex; gap: 8px; }
  .cform textarea {
    flex: 1; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); font: inherit; font-size: 13.5px; padding: 8px 10px; resize: vertical; min-height: 40px;
  }
  .cform button {
    align-self: flex-end; background: var(--text); color: #111; border-radius: 8px;
    padding: 8px 14px; font-weight: 600; font-size: 13px;
  }
  .cform button:disabled { opacity: .4; cursor: default; }
  .hint { font-size: 11.5px; color: #6c6c6c; }
  @media (max-width: 760px) {
    .lbbody { flex-direction: column; }
    .lbside { width: 100%; border-left: none; border-top: 1px solid var(--line); max-height: 46%; }
    .navbtn { font-size: 26px; padding: 18px 10px; }
  }

  /* Compare */
  .cmp { position: fixed; inset: 0; z-index: 60; background: rgba(10,10,10,.98); display: none; flex-direction: column; }
  .cmp.open { display: flex; }
  .cmptop { display: flex; align-items: center; padding: 10px 16px; gap: 12px; }
  .cmppanes { flex: 1; display: flex; gap: 10px; padding: 0 14px 14px; min-height: 0; }
  .cmppanes.grid4 { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); }
  .cmppane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .cmppane .pimg { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #0c0c0c; }
  .cmppane .pimg img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .cmpmeta { padding: 9px 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cmpmeta .rm { margin-left: auto; color: var(--dim); font-size: 12px; }
  .cmpmeta .rm:hover { color: var(--fav); }
  @media (max-width: 760px) { .cmppanes { flex-direction: column; } .cmppanes.grid4 { grid-template-columns: 1fr 1fr; } }

  /* Admin summary */
  .admin { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 18px; }
  .admin h2 { font-size: 14px; margin-bottom: 10px; }
  .statrow { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .stat { background: var(--panel2); border-radius: 8px; padding: 8px 14px; font-size: 13px; color: var(--dim); }
  .stat b { color: var(--text); font-size: 16px; margin-right: 5px; }
  .adminbtns { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Intro / compare helper */
  .intro {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 18px; font-size: 14px; color: var(--dim);
    display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap;
  }
  .intro .body { flex: 1; min-width: 240px; }
  .intro h2 { font-size: 13px; color: var(--text); margin-bottom: 5px; }
  .intro b { color: var(--text); font-weight: 600; }
  .intro .chip { flex-shrink: 0; }
  .cmphelp {
    margin-top: 10px; font-size: 13px; color: var(--accent);
    border: 1px dashed var(--accent); border-radius: 8px; padding: 7px 12px;
  }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 99;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 18px; font-size: 13.5px; display: none;
  }
  .center { display: flex; align-items: center; justify-content: center; min-height: 70vh; color: var(--dim); text-align: center; padding: 20px; }
  .empty { color: var(--dim); text-align: center; padding: 60px 0; }

  button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 3px solid #ececec; outline-offset: 3px; }
  button[hidden] { display: none; }
  .card .imgwrap { display: block; width: 100%; }
  .stars { gap: 2px; }
  .stars button { min-width: 28px; min-height: 32px; color: #aaa; }
  .cardrow { flex-wrap: wrap; gap: 3px; }
  .cardmeta { padding: 8px 6px; }
  .chip { min-height: 36px; }
  .hint { color: #aaa; }
  .rating-legend { color: #bcbcbc; font-size: 12px; margin-top: 8px; }
  .save-notice { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #ccc; }
  .save-notice.err, .unsaved { color: #ffb5ad; }
  .unsaved { font-size: 12px; }
  .lb > .save-notice, .cmp > .save-notice { padding: 0 16px 6px; }
  a.chip.finals { color: #ffaaa0; }
  .cmphelp { color: #ffaaa0; }
  .entry-help { max-width: 620px; padding: 64px 24px; }
  .entry-help h1 { font-size: 26px; margin-bottom: 20px; }
  .entry-help p { margin: 20px 0; color: #bbb; }
  .entry-help a { color: #ececec; }
  .entry-help label { display: block; margin-bottom: 8px; }
  .entry-help input { display: block; width: 100%; min-height: 48px; margin-bottom: 16px; padding: 12px; border: 1px solid #888; border-radius: 4px; background: #242424; color: #ececec; font: inherit; }
  .entry-help input:focus-visible { outline: 3px solid #ececec; outline-offset: 3px; }
  .entry-help button { min-height: 44px; }
  .entry-help #entry-message { min-height: 24px; }

  @media (max-width: 560px) {
    header { position: static; padding: 12px; }
    main { padding: 12px; }
    .toolbar { gap: 6px; }
    .chip { padding: 7px 10px; }
    .brand { letter-spacing: .18em; }
    .cmppanes { gap: 6px; padding: 0 6px 6px; }
    .cmpmeta { padding: 7px 5px; gap: 3px; }
    .cmpmeta .stars button { min-width: 25px; }
    .cmpmeta .rm { min-height: 32px; }
  }
@media (max-width: 360px) { .grid { grid-template-columns: 1fr; } }
</style>

<body>
<div id="app"><div class="center">Loading gallery…</div></div>
<div class="toast live-region" id="toast" role="status" aria-live="polite"></div>
<script src="../assets/js/save-queue.js"></script>
<script src="../assets/js/bounded-download.js"></script>

<script>
(function () {
  var SUPA = "https://yignpdzywcxbfhdqipav.supabase.co";
  var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlpZ25wZHp5d2N4YmZoZHFpcGF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxMjE5MDAsImV4cCI6MjA4NTY5NzkwMH0.RLzcnZNDQBis5z6WPLqTUSeaRJxjOh9p1kk89PDtsCQ";
  var token = new URLSearchParams(location.search).get("t") || "";
  var S = { data: null, images: [], filter: "all", compareMode: false, sel: [], lbIndex: -1, pending: 0, commentDrafts: {} };
  var app = document.getElementById("app");

  function rpc(name, args) {
    var controller = new AbortController();
    var timeout = setTimeout(function () { controller.abort(); }, 20000);
    return fetch(SUPA + "/rest/v1/rpc/" + name, {
      signal: controller.signal,
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": KEY, "Authorization": "Bearer " + KEY },
      body: JSON.stringify(args)
    }).then(function (r) {
      if (!r.ok) { return r.text().then(function (t) { var error = new Error(t || r.status); error.status = r.status; throw error; }); }
      var ct = r.headers.get("content-type") || "";
      return ct.indexOf("json") >= 0 ? r.json() : null;
    }).finally(function () { clearTimeout(timeout); });
  }
  function imgUrl(path) { return SUPA + "/storage/v1/object/public/proofing/" + String(path).split("/").map(encodeURIComponent).join("/"); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function toast(msg, ms) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.style.display = "block";
    clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = "none"; }, ms || 2200);
  }


  var CRC_T = (function () {
    var t = [], c, k, n;
    for (n = 0; n < 256; n++) { c = n; for (k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();
  function crc32(u8) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  // Minimal STORE-method zip (JPEGs don't recompress) — no libraries.
  function makeZip(entries) {
    var parts = [], central = [], offset = 0, enc = new TextEncoder();
    entries.forEach(function (e) {
      var nm = enc.encode(e.name), sz = e.data.length, crc = crc32(e.data);
      var lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x800, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, sz, true); lh.setUint32(22, sz, true);
      lh.setUint16(26, nm.length, true);
      parts.push(new Uint8Array(lh.buffer), nm, e.data);
      var cd = new DataView(new ArrayBuffer(46));
      cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(8, 0x800, true);
      cd.setUint32(16, crc, true); cd.setUint32(20, sz, true); cd.setUint32(24, sz, true);
      cd.setUint16(28, nm.length, true); cd.setUint32(42, offset, true);
      central.push(new Uint8Array(cd.buffer), nm);
      offset += 30 + nm.length + sz;
    });
    var cdSize = 0;
    central.forEach(function (p) { cdSize += p.length; });
    var eocd = new DataView(new ArrayBuffer(22));
    eocd.setUint32(0, 0x06054b50, true);
    eocd.setUint16(8, entries.length, true); eocd.setUint16(10, entries.length, true);
    eocd.setUint32(12, cdSize, true); eocd.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [new Uint8Array(eocd.buffer)]), { type: "application/zip" });
  }
  function saveBlob(blob, name) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
  }
  function downloadOne(img) {
    return fetch(imgUrl(img.preview_path))
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
      .then(function (b) { saveBlob(b, img.filename); })
      .catch(function () { toast("Download failed — check your connection and try again."); });
  }

  function isAdmin() { return S.data && S.data.role === "admin"; }
  function ratedCount() {
    return S.images.filter(function (i) { return !!i.rating; }).length;
  }
  function filtered() {
    var f = S.filter;
    return S.images.filter(function (i) {
      if (f === "all") return true;
      if (f === "unrated") return !i.rating;
      if (f === "commented") return i.comments.length > 0;
      if (f === "top") return (i.rating || 0) >= 4;
      return true;
    });
  }

  var savedOnce = false;
  var draftKey = '';
  var storageAvailable = true;
  var saves = new SFTLSaveQueue(function (id, rating) {
    return rpc("proof_set_feedback", { p_token: token, p_image_id: id, p_rating: rating, p_favorite: false });
  }, function (state) {
    if (draftKey) {
      try {
        if (state.unsaved) localStorage.setItem(draftKey, JSON.stringify(state.items.map(function (item) { return { id: item.id, value: item.value }; })));
        else localStorage.removeItem(draftKey);
      } catch (_) { storageAvailable = false; }
    }
    paintSaveState();
  });
  function paintSaveState() {
    var state = saves.snapshot();
    S.pending = state.unsaved;
    var message = state.failed ? state.failed + " choice(s) not saved. Retry saving." : state.pending ? "Saving choices…" : savedOnce ? "All choices saved ✓" : "";
    if (state.unsaved && !storageAvailable) message += " Keep this page open until saved.";
    document.querySelectorAll('.save-text').forEach(function (el) { el.textContent = message; });
    document.querySelectorAll('.retry-saves').forEach(function (el) { el.hidden = !state.failed; el.onclick = function () { saves.retry(); }; });
    document.querySelectorAll('.save-notice').forEach(function (el) { el.classList.toggle('err', !!state.failed); });
    document.querySelectorAll('[data-unsaved]').forEach(function (el) {
      var item = state.items.find(function (entry) { return entry.id === el.getAttribute('data-unsaved'); });
      el.textContent = item ? item.error ? "Not saved" : "Saving…" : "";
    });
  }
  function saveNotice() {
    return "<div class='save-notice' role='status' aria-live='polite'><span class='save-text'></span><button class='chip retry-saves' hidden>Retry saving</button></div>";
  }
  function pushFeedback(img) {
    savedOnce = true;
    saves.set(img.id, img.rating || null);
  }
  window.addEventListener('beforeunload', function (event) {
    if (saves.snapshot().unsaved) { event.preventDefault(); event.returnValue = ''; }
  });
  window.addEventListener('online', function () { saves.retry(); });
  function setRating(img, n) {
    if (S.workflowBusy || (!isAdmin() && (S.data.gallery.album_mode === "delivery" || S.data.gallery.stage && S.data.gallery.stage !== "review"))) return;
    var oldStage = S.data.gallery.stage;
    S.data.gallery.stage = "review";
    img.rating = (img.rating === n) ? null : n;
    pushFeedback(img); refreshImageUI(img);
    if (oldStage && oldStage !== "review") { var panel = document.getElementById("workflow-panel"); if (panel) { panel.outerHTML = workflowHtml(); bindWorkflow(); } }
  }
  function addComment(img, body, done) {
    rpc("proof_add_comment", { p_token: token, p_image_id: img.id, p_body: body })
      .then(function (c) { img.comments.push(c); refreshImageUI(img); done(true); })
      .catch(function () { toast("Couldn't post comment — try again."); done(false); });
  }
  function deleteComment(img, cid) {
    rpc("proof_delete_comment", { p_token: token, p_comment_id: cid })
      .then(function () {
        img.comments = img.comments.filter(function (c) { return c.id !== cid; });
        refreshImageUI(img);
      })
      .catch(function () { toast("Couldn't delete comment."); });
  }

  function starsHtml(img, cls) {
    var h = '<span class="stars ' + (cls || "") + '" data-img="' + img.id + '">';
    for (var n = 1; n <= 5; n++) {
      h += '<button ' + ((!isAdmin() && (S.data.gallery.album_mode === 'delivery' || S.data.gallery.stage && S.data.gallery.stage !== 'review')) ? 'disabled ' : '') + 'data-star="' + n + '" aria-label="Rate ' + esc(img.filename) + ' ' + n + ' out of 5" aria-pressed="' + (img.rating === n) + '" class="' + ((img.rating || 0) >= n ? "lit" : "") + '">' + ((img.rating || 0) >= n ? "★" : "☆") + "</button>";
    }
    return h + "</span>";
  }

  function render() {
    var g = S.data.gallery;
    var list = filtered();
    var total = S.images.length;
    var focus = document.activeElement;
    var focusId = focus && focus.id;
    var focusOpen = focus && focus.getAttribute('data-open');
    var focusFilter = focus && focus.getAttribute('data-filter');
    var h = "";

  function workflowHtml() {

      stage === "submitted" ? "Your selection is saved for Daniel. Reopen it if you need to change your choices." :

      "Open Finished photos to view and download the edited images.";
    var h = '<section class="intro" id="workflow-panel" aria-label="Album progress"><div class="body"><h2>' + names[stage] + '</h2><p>' + message + '</p></div>';
    if (stage === "review" && (isAdmin() || S.data.gallery.album_mode !== "delivery")) h += '<button class="chip" data-stage="submitted">Submit selection</button>';
    if (stage === "submitted" || stage === "editing" || (stage === "delivered" && isAdmin())) h += '<button class="chip" data-stage="review">Reopen selection</button>';
    if (isAdmin() && stage === "submitted") h += '<button class="chip" data-stage="editing">Start editing</button>';

    if (S.finalsCount) h += '<a class="chip" href="finals/?t=' + encodeURIComponent(token) + '">Finished photos (' + S.finalsCount + ')</a>';
    return h + '<p id="workflow-message" tabindex="-1" role="status" aria-live="polite"></p></section>';
  }
  async function changeStage(stage) {
    if (S.workflowBusy) return;
    S.workflowBusy = true;
    var message = document.getElementById("workflow-message");
    document.querySelectorAll("[data-stage]").forEach(function (b) { b.disabled = true; });
    try {
      message.textContent = "Checking your saved selection…";
      await saves.settled();
      var fresh = await rpc("proof_get_gallery", { p_token: token });
      var same = fresh.images.length === S.images.length && fresh.images.every(function (img) { var local = byId(img.id); return local && (local.rating || null) === (img.rating || null); });
      if (!same || fresh.gallery.stage !== S.data.gallery.stage) {
        message.textContent = "This album changed in another window. Reload to see the latest selection before continuing.";
        return;
      }
      var count = fresh.images.filter(function (i) { return i.rating >= 4; }).length;
      if (stage === "submitted" && !count) { message.textContent = "Choose at least one photograph with 4 or 5 stars first."; return; }
      var question = stage === "submitted" ? "Submit " + count + " selected photograph" + (count === 1 ? "" : "s") + " for editing?" : stage === "review" ? "Reopen this selection? Daniel will see that the album needs review again." : stage === "editing" ? "Mark this selection as being edited?" : "Mark the finished photographs as delivered? This does not send a message to the client.";
      if (!await SFTLDialog.confirm(question)) { message.textContent = "No change made."; return; }
      var result = await rpc("proof_set_album_stage", { p_token: token, p_gallery_id: fresh.gallery.id, p_stage: stage, p_expected_version: fresh.gallery.workflow_version });
      Object.assign(S.data.gallery, result);
      render();
      document.getElementById("workflow-message").focus();
      document.getElementById("workflow-message").textContent = stage === "submitted" ? "Selection submitted. Daniel can see it in the album dashboard." : "Album updated.";
    } catch (error) {
      message.textContent = saves.snapshot().unsaved ? "Save or retry your unsaved choices before submitting." : "The album could not be updated. Check your connection and try again; if the album changed elsewhere, reload first.";
    } finally {
      S.workflowBusy = false;
      document.querySelectorAll("[data-stage]").forEach(function (b) { b.disabled = false; });
    }
  }

  function updateProgress() {
    var selected = document.getElementById("selected-count");
    if (selected) selected.textContent = S.images.filter(function (i) { return i.rating >= 4; }).length;
    var total = S.images.length, done = ratedCount();
    var f = document.getElementById("pfill"), c = document.getElementById("pcount");
    if (f) f.style.width = (total ? Math.round(done / total * 100) : 0) + "%";
    if (c) c.textContent = done + " of " + total + " rated";

  function lightboxShell() {
    return "<div class='lb' id='lb' aria-label='Photo review'>" +
      "<div class='lbtop'><span class='fname' id='lbname'></span><span class='lbcount' id='lbcountEl'></span>" +

      saveNotice() + "<div class='lbbody'><div class='lbstage'>" +
      "<button class='navbtn prev' id='lbprev' aria-label='Previous photo'>‹</button><img id='lbimg' src='' alt=''><button class='navbtn next' id='lbnext' aria-label='Next photo'>›</button>" +

  function lbImage() { return S.lbIndex >= 0 ? (S.lbImages || [])[S.lbIndex] : null; }

  function openLb(id) {
    var list = filtered();
    var ix = -1;
    list.forEach(function (im, i) { if (im.id === id) ix = i; });
    if (ix < 0) return;

  function paintLb() {
    var img = lbImage(); if (!img) return;

    side += "<div class='cform'><textarea id='cbox' aria-label='Comment on this photo' maxlength='2000' placeholder='What do you think? e.g. love this one, crop tighter…'></textarea><button id='csend'>Post</button></div>";

  function commentsHtml(img) {
    if (!img.comments.length) return "<div class='hint'>No comments yet.</div>";
    var mine = isAdmin() ? "photographer" : "client";
    return img.comments.map(function (c) {
      var who = c.author === mine ? "You" : (c.author === "client" ? "Client" : "Photographer");
      var del = isAdmin() ? "<button class='del' data-delc='" + c.id + "'>delete</button>" : "";
      return "<div class='comment'><div class='who'><span>" + who + " · " + new Date(c.created_at).toLocaleDateString() + "</span>" + del + "</div>" + esc(c.body) + "</div>";
    }).join("");

  function bindSide(img) {
    var box = document.getElementById("cbox"), send = document.getElementById("csend");
    box.value = S.commentDrafts[img.id] || "";
    box.oninput = function () { S.commentDrafts[img.id] = box.value; };
    send.onclick = function () {
      if (send.disabled) return;
      var v = box.value.trim(); if (!v) return;
      send.disabled = true;
      addComment(img, v, function (ok) {
        send.disabled = false;
        if (ok) {
          delete S.commentDrafts[img.id];
          if (lbImage() && lbImage().id === img.id) {
            document.getElementById("cbox").value = "";
            document.getElementById("lbcomments").innerHTML = commentsHtml(img); bindDeletes(img);
          }
          toast("Comment saved for " + img.filename);
        }
      });
    };
    box.onkeydown = function (e) { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) send.onclick(); e.stopPropagation(); };
    bindDeletes(img);
  }
  function bindDeletes(img) {
    document.querySelectorAll("[data-delc]").forEach(function (b) {
      b.onclick = function () { deleteComment(img, b.getAttribute("data-delc")); };
    });

  function compareShell() {
    return "<div class='cmp' id='cmp' aria-label='Compare photos'><div class='cmptop'><h1 style='font-size:15px'>Compare</h1>" +
      "<span class='sub'>rate each, or remove to narrow down</span>" +
      "<button class='lbclose' id='cmpclose' aria-label='Close'>✕</button></div>" +
      saveNotice() + "<div class='cmppanes' id='cmppanes'></div></div>";
  }
  function openCompare() {
    var panes = "";
    S.sel.forEach(function (id) {
      var img = byId(id); if (!img) return;
      panes += "<div class='cmppane' data-pane='" + img.id + "'>";
      panes += "<div class='pimg'><img src='" + esc(imgUrl(img.preview_path)) + "' alt='" + esc(img.filename) + "'></div>";
      panes += "<div class='cmpmeta'><span class='fname'>" + esc(img.filename) + "</span>" + starsHtml(img);

  function byId(id) {
    for (var i = 0; i < S.images.length; i++) if (S.images[i].id === id) return S.images[i];
    return null;
  }

  function refreshImageUI(img) {
    // Re-render star/fav/comment widgets for this image everywhere they appear.
    document.querySelectorAll(".stars[data-img='" + img.id + "']").forEach(function (el) {
      el.querySelectorAll("button").forEach(function (b, i) {
        var lit = (img.rating || 0) >= i + 1;
        b.className = lit ? "lit" : ""; b.textContent = lit ? "★" : "☆";

  function bindActionEls(root) {
    root.querySelectorAll(".stars[data-img]").forEach(function (el) {
      var img = byId(el.getAttribute("data-img"));
      el.querySelectorAll("button").forEach(function (b) {
        b.onclick = function (e) { e.stopPropagation(); setRating(img, parseInt(b.getAttribute("data-star"), 10)); };
      });
    });

  function bind() {
    bindActionEls(document);
    document.querySelectorAll("[data-filter]").forEach(function (b) {
      b.onclick = function () { S.filter = b.getAttribute("data-filter"); render(); };
    });
    document.querySelectorAll("[data-open]").forEach(function (el) {
      el.onclick = function () {
        var id = el.getAttribute("data-open");
        if (S.compareMode) {
          var ix = S.sel.indexOf(id);
          if (ix >= 0) S.sel.splice(ix, 1);
          else if (S.sel.length < 4) S.sel.push(id);
          else { toast("Compare up to 4 at a time."); return; }
          render();
        } else openLb(id);
      };
    });
    var da = document.getElementById("dlall");
    if (da) da.onclick = async function () {
      if (S.downloading) return;
      if (S.images.length > 200) { toast("This album is too large for a web ZIP. Open photographs to download them individually.", 6000); return; }
      S.downloading = true; da.disabled = true;
      var files = [], total = 0;
      try {
        for (var ix = 0; ix < S.images.length; ix++) {
          var img = S.images[ix], controller = new AbortController();
          var timeout = setTimeout(function () { controller.abort(); }, 30000);
          da.textContent = "Preparing " + (ix + 1) + "/" + S.images.length;
          try {
            var response = await fetch(imgUrl(img.preview_path), {signal:controller.signal});
            var blob = await SFTLReadLimited(response, Math.min(8 * 1048576, 32 * 1048576 - total));
            total += blob.size;
            files.push({name:img.filename.replace(/[\\/]/g, '_'), data:new Uint8Array(await blob.arrayBuffer())});
          } finally { clearTimeout(timeout); }
        }
        if (files.length) { saveBlob(makeZip(files), (S.data.gallery.slug || "gallery") + "-web-photos.zip"); toast("Web-photo ZIP download started. Check your browser downloads.", 5000); }
      } catch (error) {
        toast(/too large|individually/.test(error.message) ? error.message : "The ZIP could not be prepared. Check your connection and retry, or download photographs individually.", 7000);
      } finally {
        files = []; S.downloading = false;
        var button = document.getElementById("dlall"); if (button) { button.textContent = "Download web photos"; button.disabled = false; }
      }
    };
    var cm = document.getElementById("cmpmode");
    if (cm) cm.onclick = function () { S.compareMode = !S.compareMode; if (!S.compareMode) S.sel = []; render(); };
    var cg = document.getElementById("cmpgo");
    if (cg) cg.onclick = openCompare;
    document.getElementById("lbclose").onclick = closeLb;
    document.getElementById("lbprev").onclick = function () { navLb(-1); };
    document.getElementById("lbnext").onclick = function () { navLb(1); };
    document.getElementById("cmpclose").onclick = function () { closeCompare(); render(); };
    var stage = document.querySelector(".lbstage");
    var tx = null;
    stage.addEventListener("touchstart", function (e) { tx = e.touches[0].clientX; }, { passive: true });
    stage.addEventListener("touchend", function (e) {
      if (tx === null) return;
      var dx = e.changedTouches[0].clientX - tx; tx = null;
      if (Math.abs(dx) > 45) navLb(dx > 0 ? -1 : 1);
    }, { passive: true });
    document.getElementById("reviewhelp").onclick = function () { S.showHelp = !S.showHelp; render(); };
    var io = document.getElementById("introok");
    if (io) io.onclick = function () {
      S.showHelp = false;
      render();
    };
    var cp = document.getElementById("copysel");
    if (cp) cp.onclick = function () {
      var names = S.images.filter(function (i) { return (i.rating || 0) >= 4; })
        .map(function (i) { return i.filename; });
      navigator.clipboard.writeText(names.join("\n")).then(function () {
        toast("Copied " + names.length + " filenames.");
      });
    };
    var dl = document.getElementById("dlcsv");
    if (dl) dl.onclick = function () {
      var rows = [["filename", "rating", "comments"]];
      S.images.forEach(function (i) {
        rows.push([i.filename, i.rating || "",
          i.comments.map(function (c) { return c.author + ": " + c.body.replace(/\s+/g, " "); }).join(" | ")]);
      });
      var csv = rows.map(function (r) {
        return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(",");
      }).join("\n");
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
      a.download = (S.data.gallery.slug || "gallery") + "-proofs-feedback.csv"; a.click();
    };
  }

  document.addEventListener("keydown", function (e) {
    if (document.getElementById("cmp") && document.getElementById("cmp").classList.contains("open")) {
      if (e.key === "Escape") { closeCompare(); render(); }
      return;
    }
    var img = lbImage(); if (!img) return;
    if (e.target && /TEXTAREA|INPUT|SELECT/.test(e.target.tagName)) return;
    if (["Escape", "ArrowLeft", "ArrowRight"].indexOf(e.key) >= 0) e.preventDefault();
    if (e.key === "Escape") closeLb();
    else if (e.key === "ArrowLeft") navLb(-1);
    else if (e.key === "ArrowRight") navLb(1);
    else if (e.key >= "1" && e.key <= "5") setRating(img, parseInt(e.key, 10));
    else if (e.key === "0" && !S.workflowBusy && (isAdmin() || S.data.gallery.album_mode !== "delivery" && (!S.data.gallery.stage || S.data.gallery.stage === "review"))) { S.data.gallery.stage = "review"; img.rating = null; pushFeedback(img); refreshImageUI(img); }
  });

  function loadGallery() {
    if (!token) {
      app.innerHTML = "<main class='entry-help'><a class='brand' href='../'>STORIES FROM THE LENS</a><h1>Your album</h1><p>Enter the gallery code sent with your album.</p><form id='album-entry'><label for='album-code'>Gallery code</label><input id='album-code' name='album-code' type='text' autocomplete='off' autocapitalize='characters' spellcheck='false' maxlength='100' required aria-describedby='entry-message'><button class='chip' type='submit'>Open album</button><p id='entry-message' role='status' aria-live='polite'></p></form><p>You can also open your album directly using the link in your message.</p><p>Can't find your code or link? <a href='mailto:daniel@storiesfromthelens.com?subject=My%20album%20access'>Contact</a></p><a href='../'>Back to the website</a></main>";
      document.getElementById('album-entry').addEventListener('submit', async function (event) {
        event.preventDefault();
        var input = document.getElementById('album-code'), button = event.target.querySelector('button'), message = document.getElementById('entry-message');
        if (button.disabled) return;
        input.removeAttribute('aria-invalid');
        if (!/^[0-9a-f]{20}$/i.test(input.value.replace(/[\s-]/g, ''))) {
          message.textContent = 'Check your code and enter all 20 letters and numbers. Spaces and hyphens are fine.';
          input.setAttribute('aria-invalid', 'true'); input.focus(); return;
        }
        button.disabled = true; message.textContent = 'Opening album…';
        try {
          var result = await rpc('proof_open_album', {p_code: input.value});
          if (!result || !result.token) throw new Error('Missing album');
          location.assign('?t=' + encodeURIComponent(result.token));
        } catch (error) {
          var invalid = error.status === 401 || error.status === 403;
          message.textContent = invalid ? 'That code was not recognised. Check the code in your message and try again.' : 'Your album could not be opened. Check your connection and try again.';
          if (invalid) input.setAttribute('aria-invalid', 'true');
          button.disabled = false; input.focus();
        }
      });
      return;
    }
    app.innerHTML = "<div class='center' role='status'>Loading your album…</div>";
    Promise.all([
      rpc("proof_get_gallery", { p_token: token }),
      rpc("proof_finals_list", { p_token: token }).catch(function () { return { unavailable: true }; })
    ]).then(function (result) {
      var data = result[0], finals = result[1];
      S.data = data; S.images = data.images || [];
      S.finalsCount = (finals.finals || []).length;
      S.finalsUnavailable = !!finals.unavailable;
      document.title = "SFTL · " + data.gallery.title;
      draftKey = 'sftl-unsaved-' + data.gallery.id + '-' + data.role;
      try {
        var drafts = JSON.parse(localStorage.getItem(draftKey) || '[]');
        if (Array.isArray(drafts)) drafts.forEach(function (draft) {
          var img = byId(draft.id);
          if (img && (draft.value === null || Number.isInteger(draft.value) && draft.value >= 1 && draft.value <= 5) && img.rating !== draft.value) {
            img.rating = draft.value; savedOnce = true; saves.set(img.id, draft.value, true);
          }
        });
      } catch (_) { storageAvailable = false; }
      saves.notify();
      if (!saves.snapshot().unsaved && !isAdmin() && (data.gallery.stage === "delivered" || data.gallery.album_mode === "delivery") && new URLSearchParams(location.search).get("view") !== "review") {
        location.replace("finals/?t=" + encodeURIComponent(token)); return;
      }
      render();
    }).catch(function (error) {
      var invalid = error.status === 401 || error.status === 403 || /invalid token/.test(error.message);
      app.innerHTML = "<main class='entry-help'><h1>" + (invalid ? "This album link isn't valid" : "Your album couldn't load") + "</h1><p>" + (invalid ? "Use your full album link, or request it again." : "Check your connection and try again. Your saved choices are still there.") + "</p><button class='chip' id='retry-load'>Try again</button><p><a href='./'>Enter a gallery code</a></p><p><a href='mailto:daniel@storiesfromthelens.com'>Contact</a></p></main>";
      document.getElementById('retry-load').onclick = loadGallery;
    });
  }
  loadGallery();
})();
</script>
</body>
